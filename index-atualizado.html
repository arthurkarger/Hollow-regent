<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>O Regente Oco</title>
<style>
:root{--bg:#04050a;--fg:#c9d6e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{width:min(100%,calc((100vh - 8px)*1.7778));aspect-ratio:16/9;display:block;touch-action:none}
#touch-controls{display:none}
@media (pointer:coarse){
  body{position:relative}
  #touch-controls{display:flex;position:fixed;inset:auto 0 max(10px,env(safe-area-inset-bottom,0px)) 0;
    align-items:flex-end;justify-content:space-between;padding:0 14px;gap:10px;z-index:10;
    pointer-events:none;font-family:Arial,sans-serif;user-select:none;-webkit-user-select:none}
  .touch-cluster{display:flex;align-items:flex-end;gap:9px;pointer-events:auto}
  .touch-btn{width:clamp(48px,13vw,66px);height:clamp(48px,13vw,66px);border:1px solid rgba(210,225,255,.42);
    border-radius:50%;background:rgba(12,18,31,.72);color:#eef3ff;font-size:clamp(16px,4vw,22px);
    font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px #0008;
    touch-action:none;-webkit-tap-highlight-color:transparent}
  .touch-btn.action{width:clamp(52px,14vw,72px);height:clamp(52px,14vw,72px);font-size:clamp(11px,3vw,14px)}
  .touch-btn:active,.touch-btn.down{background:rgba(115,145,205,.78);transform:scale(.96)}
  #touch-extra{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top,0px));display:flex;gap:7px;z-index:11}
  #touch-extra .touch-btn{width:38px;height:38px;font-size:13px}
}
@media (pointer:coarse) and (orientation:portrait){
  #touch-controls{padding:0 9px;gap:5px}
  .touch-cluster{gap:5px}
  .touch-btn{width:48px;height:48px}
  .touch-btn.action{width:52px;height:52px}
}
</style></head><body><canvas id="c"></canvas>
<div id="touch-controls" aria-label="Controles de toque">
  <div class="touch-cluster">
    <button class="touch-btn" data-hold="ArrowLeft" aria-label="Mover para esquerda">◀</button>
    <button class="touch-btn" data-hold="ArrowRight" aria-label="Mover para direita">▶</button>
  </div>
  <div class="touch-cluster">
    <button class="touch-btn action" data-hold="KeyZ">PULAR</button>
    <button class="touch-btn action" data-tap="KeyX">ATACAR</button>
    <button class="touch-btn action" data-tap="KeyC">DASH</button>
    <button class="touch-btn action" data-tap="KeyE">FALAR</button>
    <button class="touch-btn action" data-tap="KeyQ">CURAR</button>
  </div>
</div>
<div id="touch-extra" aria-label="Controles de menu">
  <button class="touch-btn" data-tap="ArrowUp" aria-label="Opção anterior">▲</button>
  <button class="touch-btn" data-tap="ArrowDown" aria-label="Próxima opção">▼</button>
  <button class="touch-btn" data-tap="Enter" aria-label="Confirmar">OK</button>
  <button class="touch-btn" data-tap="KeyR" aria-label="Reiniciar">R</button>
</div>
<script>
// ================= BASE =================
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540,GY=460,WW=2700,AL=1400,AR=2660;
C.width=W;C.height=H;
const L=document.createElement('canvas');L.width=W;L.height=H;const LX=L.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const keys={},pressed={};
addEventListener('keydown',e=>{if(!keys[e.code])pressed[e.code]=1;keys[e.code]=1;initAudio();if(/Space|Arrow/.test(e.code))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
// Controles por toque: direções podem ficar pressionadas; ações são toques rápidos.
document.querySelectorAll('[data-hold],[data-tap]').forEach(btn=>{
  const code=btn.dataset.hold||btn.dataset.tap;
  const hold=!!btn.dataset.hold;
  const down=e=>{
    e.preventDefault();initAudio();btn.classList.add('down');
    if(hold){if(!keys[code])pressed[code]=1;keys[code]=1;}
    else{pressed[code]=1;keys[code]=1;}
    try{btn.setPointerCapture(e.pointerId)}catch(_){}
  };
  const up=e=>{
    e.preventDefault();btn.classList.remove('down');
    keys[code]=0;
  };
  btn.addEventListener('pointerdown',down);
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',up);
  btn.addEventListener('lostpointercapture',up);
});
const K=(...c)=>c.some(x=>keys[x]),P=(...c)=>c.some(x=>pressed[x]);
// ================= ÁUDIO (sintetizado) =================
let AC,mg,m1,m2,mf;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.05;mg.connect(AC.destination);
m1=AC.createOscillator();m1.type='sawtooth';m1.frequency.value=55;m2=AC.createOscillator();m2.type='triangle';m2.frequency.value=82.5;
mf=AC.createBiquadFilter();mf.frequency.value=260;m1.connect(mf);m2.connect(mf);mf.connect(mg);m1.start();m2.start()}catch(e){AC=null}}
function music(m){if(!AC)return;const t=AC.currentTime,f=[[55,82.5,260,.05],[49,73.4,420,.07],[36.7,55,1100,.1],[30,45,150,.0]][m];
m1.frequency.setTargetAtTime(f[0],t,.5);m2.frequency.setTargetAtTime(f[1],t,.5);mf.frequency.setTargetAtTime(f[2],t,.5);mg.gain.setTargetAtTime(f[3],t,.5)}
function sfx(f,d,ty='square',v=.08,end=f/2){if(!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
// ================= MUNDO =================
const PL=[{x:1540,y:372,w:170},{x:2330,y:372,w:170}];
const ceilY=x=>x<1230?112+26*Math.sin(x*.011)+14*Math.sin(x*.037):x<1420?112*(1-(x-1230)/190)-20*((x-1230)/190):-40;
let sd=7;const sr=()=>(sd=(sd*16807)%2147483647)/2147483647;
const STAL=[...Array(46)].map((_,i)=>({x:i*29+sr()*16,l:18+sr()*80,w:7+sr()*13}));
const FAR=[...Array(40)].map((_,i)=>({x:i*110+sr()*60,h:120+sr()*220,w:30+sr()*50}));
const DEC=[...Array(26)].map((_,i)=>({x:70+i*47+sr()*20,t:sr()<.5?1:2,s:.7+sr()}));
const LIGHTS=[{x:240,y:GY-26,c:'#4a9cff',k:'cry'},{x:620,y:150,c:'#7fd6ff',k:'orb'},{x:960,y:GY-26,c:'#58e0b8',k:'cry'},{x:1160,y:160,c:'#8aa8ff',k:'orb'}].map(l=>({...l,r:160,a:.55}));
for(let i=0;i<6;i++)LIGHTS.push({x:1535+i*230,y:GY-34,r:210,a:.5,c:'#b05cff',k:'br'});
const MT=[...Array(70)].map(()=>({x:rnd(0,WW),y:rnd(80,GY),v:rnd(3,12),p:rnd(0,6)}));
// ================= ESTADO =================
const S={coins:0,dmg:0,reach:0,spd:0,st:0,flk:0,flh:0,vit:0,agi:0,leg:0};try{Object.assign(S,JSON.parse(localStorage.getItem('regente')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('regente',JSON.stringify(S))}catch(e){}};
let G,pl,B;
function reset(){
G={co:[],sp:[],th:S.st>0?1:0,t:0,state:'play',locked:false,shake:0,stop:0,flash:0,fc:'255,255,255',cam:0,parts:[],shots:[],waves:[],fx:[],bn:{t:0},p2:false,gate:0,over:0,hb:0};
pl={x:90,y:GY,vx:0,vy:0,w:24,h:46,f:1,g:true,hp:5+S.vit,max:5+S.vit,atk:0,atkCd:0,dash:0,dashCd:0,dd:1,inv:0,hurt:0,coy:0,jb:0,jh:false,hit:false,dead:false,gh:[]};
B=mkBoss(S.st);theme();pl.fl=flMax();pl.drink=0;rollNPCs();
music(0)}
const pbox=()=>({x:pl.x-pl.w/2+2,y:pl.y-pl.h+4,w:pl.w-4,h:pl.h-4});
const bbox=()=>{const k=B.k?1.2:1;return{x:B.x-34*k,y:B.y-112*k+B.fy,w:68*k,h:112*k}};
function burst(x,y,n,c,sp=200,life=.6,sz=3,g=300){for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(.2,1)*sp;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*rnd(.6,1),m:life,s:sz*rnd(.6,1.4),c,g})}}
const ring=(x,y,r0,r1,d,c)=>G.fx.push({k:'ring',x,y,r0,r1,t:0,d,c});
// ================= JOGADOR =================
function hurtP(d,fx){const p=pl;if(p.inv>0||p.dead||G.state!='play')return;
p.hp-=d;p.inv=1.3;p.hurt=.4;p.vx=(p.x<fx?-1:1)*340;p.vy=-300;p.g=false;p.dash=0;p.atk=0;G.stop=.09;G.shake=.45;G.flash=.35;G.fc='255,30,50';
burst(p.x,p.y-24,16,'#ff5a6a',260,.5,3);sfx(110,.3,'sawtooth',.15,40);
if(p.hp<=0){p.hp=0;p.dead=true;G.state='lose';G.over=0;music(3);burst(p.x,p.y-24,40,'#e8ecf2',300,1,3)}}
function updPlayer(dt){const p=pl;if(p.dead){p.vx*=.9;p.x+=p.vx*dt;return}
p.inv=Math.max(0,p.inv-dt);p.hurt=Math.max(0,p.hurt-dt);p.atkCd-=dt;p.dashCd-=dt;p.atk=Math.max(0,p.atk-dt);p.jb-=dt;
const dir=p.hurt>0?0:(K('ArrowRight','KeyD')?1:0)-(K('ArrowLeft','KeyA')?1:0);
if(P('KeyZ','Space','ArrowUp','KeyW'))p.jb=.12;
p.coy=p.g?.1:p.coy-dt;flaskTick(dt);
if(P('KeyC','KeyK','ShiftLeft','ShiftRight')&&p.dashCd<=0&&p.hurt<=0){p.dash=.2+S.agi*.015;p.dashCd=.55-S.agi*.07;p.inv=Math.max(p.inv,.32+S.agi*.04);p.dd=dir||p.f;p.f=p.dd;p.atk=0;sfx(320,.2,'sawtooth',.06,90);burst(p.x,p.y-20,8,'#9fc4ff',120,.3,2,0)}
if(P('KeyX','KeyJ')&&p.atkCd<=0&&p.dash<=0&&p.hurt<=0&&!(p.drink>0)){p.atk=.28;p.atkCd=.34-S.spd*.05;p.hit=false;sfx(240,.12,'sawtooth',.06,520)}
if(p.dash>0){p.dash-=dt;p.vx=p.dd*820;p.vy=0;p.gh.push({x:p.x,y:p.y,a:1})}
else{p.vx+=(dir*(p.atk>0?210:290)*(1+S.leg*.1)*(p.drink>0?.35:1)-p.vx)*Math.min(1,dt*(p.g?20:11));if(dir&&p.atk<=0&&p.hurt<=0)p.f=dir;
p.vy=Math.min(900,p.vy+1900*dt);
if(p.jb>0&&p.coy>0){p.vy=-640;p.g=false;p.coy=0;p.jb=0;p.jh=true;sfx(380,.12,'triangle',.06,720)}
if(p.jh&&!K('KeyZ','Space','ArrowUp','KeyW')&&p.vy<-220)p.vy=-220;if(p.vy>=0)p.jh=false}
for(const g of p.gh)g.a-=dt*4;p.gh=p.gh.filter(g=>g.a>0);
// ataque: janela ativa
if(p.atk>0&&p.atk<.22&&p.atk>.1&&!p.hit&&canHit()){const r={x:p.f>0?p.x+6:p.x-6-(80+S.reach*14),y:p.y-62,w:80+S.reach*14,h:58};
if(ov(r,bbox())){p.hit=true;hitBoss(r)}}
p.x+=p.vx*dt;p.x=clamp(p.x,G.locked?AL+14:14,AR-14);
const py=p.y;p.y+=p.vy*dt;p.g=false;
if(p.y>=GY){p.y=GY;p.vy=0;p.g=true}
else if(p.vy>=0)for(const q of PL)if(p.x+10>q.x&&p.x-10<q.x+q.w&&py<=q.y+2&&p.y>=q.y){p.y=q.y;p.vy=0;p.g=true}
if(!G.locked&&B.st=='sleep'&&p.x>AL+70){G.locked=true;B.st='wake';B.t=0;G.bn={t:3.6,a:BOSS[B.k].name.toUpperCase(),b:BOSS[B.k].sub};G.shake=.5;sfx(70,.8,'sawtooth',.18,35);music(1)}}
function canHit(){return['idle','atk','rec'].includes(B.st)&&B.alpha>.5}
function hitBoss(r){const b=B,dm=1+S.dmg;b.hp=b.ph==1?Math.max(b.th,b.hp-dm):b.hp-dm;b.flash=.1;G.stop=.055;G.shake=.18;pl.vx=-pl.f*140;
burst(b.x,r.y+30,10,b.ph==2?'#ff4a7a':'#bcd8ff',240,.4,3);burst(b.x+(pl.x<b.x?-30:30),r.y+30,6,'#fff',200,.25,2,0);
G.fx.push({k:'hit',x:b.x+(pl.x<b.x?-30:30),y:r.y+30,t:0,d:.18});sfx(160,.15,'square',.1,60);
if(b.ph==1&&b.hp<=b.th)startTrans();else if(b.ph==2&&b.hp<=0)startDie()}
// ================= BOSS =================
function endAtk(rec){const b=B;b.st='rec';b.t=0;b.rec=rec;b.fy=0;b.sub=0;b.alpha=1;b.rot=0}
function pick(){const b=B,d=Math.abs(pl.x-b.x),n=b.ph==1?2:3;
const w=b.ph==1?[d>280?2:1,d>280?1:2]:[1,d>250?2:.8,d<260?2:.7];
if(b.at>=0&&b.rep>=1)w[b.at]=0;
let r=Math.random()*w.reduce((a,c)=>a+c,0),o=0;for(;o<n-1&&r>w[o];o++)r-=w[o];
b.rep=o===b.at?b.rep+1:0;b.at=o;b.st='atk';b.t=0;b.sub=0;b.f=pl.x<b.x?-1:1}
function updBoss(dt){const b=B;b.t+=dt;b.flash=Math.max(0,b.flash-dt);
const k=Math.min(1,dt*8);
if(b.st=='sleep'){b.wa=1.5;b.rot=.1}
else if(b.st=='wake'){b.rot=.1*(1-b.t/2.2);b.wa+=(1-b.wa)*k*.5;if(b.t>.5&&b.t<.55){ring(b.x,b.y-60,20,260,.6,'#9fd6ff');sfx(90,.9,'sawtooth',.2,40);G.shake=.5}
if(b.t>2.4){b.st='idle';b.t=0;b.rot=0}}
else if(b.st=='idle'){b.f=pl.x<b.x?-1:1;b.wa+=(1-b.wa)*k;b.rot*=.9;if(Math.abs(pl.x-b.x)>130)b.x+=b.f*(b.ph==1?70:110)*dt;if(b.t>(b.ph==1?.8:.55)&&!pl.dead)pick()}
else if(b.st=='rec'){b.wa+=(1-b.wa)*k*.6;b.rot*=.9;if(b.t>b.rec){b.st='idle';b.t=0}}
else if(b.st=='atk'){if(b.t>8)endAtk(1);else ATK[b.k][b.ph-1][b.at](dt)}
else if(b.st=='trans')TRANS[b.k](dt);else if(b.st=='die')DIE[b.k](dt);
b.x=clamp(b.x,AL+50,AR-50);
if(b.ph==2&&b.st!='die'&&Math.random()<.5)G.parts.push({x:b.x+rnd(-30,30),y:b.y-rnd(30,130)+b.fy,vx:rnd(-20,20),vy:rnd(-90,-30),l:.8,m:.8,s:rnd(2,4),c:b.k?'#7aff5a':'#ff3a66',g:-30})}
function charge(dt){const b=B,t=b.t;
if(b.sub==0){b.wa+=(1.7-b.wa)*Math.min(1,dt*8);b.rot=-.2*Math.min(1,t/.5);if(t<.55)b.f=pl.x<b.x?-1:1;
if(t>=.85){b.sub=1;b.dir=b.f;b.t2=0;b.rot=.16;sfx(120,.6,'sawtooth',.15,300)}}
else{b.t2+=dt;b.x+=b.dir*790*dt;b.wa=.2;G.parts.push({x:b.x-b.dir*30,y:b.y-rnd(10,100),vx:-b.dir*60,vy:rnd(-30,30),l:.4,m:.4,s:4,c:'#8aa8ff',g:0});
if(ov(bbox(),pbox()))hurtP(1,b.x);
const wall=b.x<=AL+51||b.x>=AR-51;
if(wall||b.t2>.8){if(wall){G.shake=.7;burst(b.x+b.dir*40,b.y-50,24,'#aab',260,.6,3);sfx(60,.3,'sawtooth',.2,30)}endAtk(wall?1.5:1.1)}}}
function slam(dt){const b=B,t=b.t,k=Math.min(1,dt*5);
if(t<.9){b.wa+=(-2.4-b.wa)*k;b.rot=-.14*Math.min(1,t/.6)}
else{if(b.sub==0)b.sub=1;b.wa+=(.75-b.wa)*Math.min(1,dt*30);b.rot=.12}
if(b.sub==1&&t>=1){b.sub=2;G.waves.push({x:b.x+b.f*70,d:b.f},{x:b.x-b.f*70,d:-b.f});G.shake=.7;burst(b.x+b.f*100,GY-4,22,'#9fb4dd',280,.6,3);ring(b.x+b.f*100,GY-6,10,120,.3,'#bcd0ff');sfx(80,.45,'sawtooth',.22,30)}
if(t>=1.3)endAtk(1.1)}
function rain(dt){const b=B,t=b.t;b.wa+=(-2.6-b.wa)*Math.min(1,dt*6);b.fy=-Math.min(1,t)*16;
if(t>.8&&t<2.4&&(b.t2-=dt)<=0){b.t2=.14;const near=Math.random()<.45;G.shots.push({x:clamp(near?pl.x+rnd(-45,45):rnd(AL+40,AR-40),AL+30,AR-30),y:-30,t:0,d:.7,vy:0});sfx(500,.1,'sine',.05,900)}
if(t>=3.2){endAtk(1)}}
function tele(dt){const b=B,t=b.t;
if(b.sub==0){if(t<.45){b.alpha=1-t/.45;b.wa+=(-1-b.wa)*.1;if(Math.random()<.6)burst(b.x+rnd(-30,30),b.y-rnd(0,110),1,'#c04aff',60,.5,3,-80)}else b.alpha=0;
if(t>=.95){const s=Math.random()<.5?-1:1;let nx=pl.x+s*135;if(nx<AL+60||nx>AR-60)nx=pl.x-s*135;b.x=clamp(nx,AL+50,AR-50);b.f=pl.x<b.x?-1:1;b.alpha=1;b.sub=1;burst(b.x,b.y-60,24,'#e05aff',260,.5,3,0);ring(b.x,b.y-60,10,100,.3,'#e05aff');sfx(520,.25,'sine',.1,150)}}
else if(b.sub==1){b.f=pl.x<b.x?-1:1;b.wa+=(-2.3-b.wa)*Math.min(1,dt*10);if(t>=1.55){b.sub=2;b.wa=.8;const z=zone();G.fx.push({k:'slash',x:b.x+b.f*20,y:b.y-60,f:b.f,t:0,d:.25});G.shake=.5;sfx(200,.2,'sawtooth',.18,700);if(ov(z,pbox()))hurtP(2,b.x)}}
else if(t>=1.8)endAtk(1)}
const zone=()=>({x:B.f>0?B.x:B.x-175,y:B.y-125,w:175,h:125});
function blast(dt){const b=B,t=b.t,R=210,cy=b.y-60;b.wa+=(-1.8-b.wa)*Math.min(1,dt*6);b.fy=-Math.sin(Math.min(t,1.1)/1.1*1.57)*16;
if(t<1.1){if(Math.random()<.9){const a=rnd(0,6.283);G.parts.push({x:b.x+Math.cos(a)*R,y:cy+Math.sin(a)*R,vx:-Math.cos(a)*R*2,vy:-Math.sin(a)*R*2,l:.5,m:.5,s:3,c:'#ff4a7a',g:0})}}
else{if(b.sub==0){b.sub=1;G.shake=.9;G.flash=.4;G.fc='255,60,100';ring(b.x,cy,20,R,.35,'#ff4a7a');burst(b.x,cy,50,'#ff4a7a',420,.7,4,0);sfx(70,.7,'sawtooth',.22,28)}
if(t<1.25){const p=pbox(),nx=clamp(b.x,p.x,p.x+p.w),ny=clamp(cy,p.y,p.y+p.h);if(Math.hypot(nx-b.x,ny-cy)<=R)hurtP(2,b.x)}}
if(t>=1.55)endAtk(1.2)}
