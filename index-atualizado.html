<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>O Regente Oco</title>
<style>
:root{--bg:#04050a;--fg:#c9d6e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{width:min(100%,calc((100vh - 8px)*1.7778));aspect-ratio:16/9;display:block;touch-action:none}
#touch-controls{display:none}
/* Plataforma: controles de toque somente em dispositivos móveis */
body.is-pc #touch-controls,body.is-pc #touch-extra{display:none!important}
body.is-mobile #touch-controls{display:flex}
body.is-mobile #touch-extra{display:flex}
@media (pointer:coarse){
  body{position:relative}
  #touch-controls{display:flex;position:fixed;inset:auto 0 max(10px,env(safe-area-inset-bottom,0px)) 0;
    align-items:flex-end;justify-content:space-between;padding:0 14px;gap:10px;z-index:10;
    pointer-events:none;font-family:Arial,sans-serif;user-select:none;-webkit-user-select:none}
  .touch-cluster{display:flex;align-items:flex-end;gap:9px;pointer-events:auto}
  .touch-btn{width:clamp(48px,13vw,66px);height:clamp(48px,13vw,66px);border:1px solid rgba(210,225,255,.42);
    border-radius:50%;background:rgba(12,18,31,.72);color:#eef3ff;font-size:clamp(16px,4vw,22px);
    font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px #0008;
    touch-action:none;-webkit-tap-highlight-color:transparent}
  .touch-btn.action{width:clamp(52px,14vw,72px);height:clamp(52px,14vw,72px);font-size:clamp(11px,3vw,14px)}
  .touch-btn:active,.touch-btn.down{background:rgba(115,145,205,.78);transform:scale(.96)}
  #touch-extra{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top,0px));display:flex;gap:7px;z-index:11}
  #touch-extra .touch-btn{width:38px;height:38px;font-size:13px}
}
@media (pointer:coarse) and (orientation:portrait){
  #touch-controls{padding:0 9px;gap:5px}
  .touch-cluster{gap:5px}
  .touch-btn{width:48px;height:48px}
  .touch-btn.action{width:52px;height:52px}
}

.menu-panel{position:relative;box-sizing:border-box;width:min(90vw,400px);max-height:100%;overflow:auto;text-align:left;scrollbar-width:thin}
[data-screen=main] .menu-panel{width:auto;max-width:90%;margin-left:clamp(6px,6vw,120px);padding:3px 10px}
#game-menu h1{font-size:clamp(24px,4vw,42px);font-weight:400;letter-spacing:.045em;margin:0 0 .6em;line-height:1.15}
[data-screen=main] h1{font-size:clamp(31px,5.8vw,88px)!important;letter-spacing:.025em!important;font-variant:small-caps}
.menu-btn,#scroll-prices button{display:block;box-sizing:border-box;width:100%;min-height:40px;border:0;border-bottom:1px solid #343434;border-radius:0;background:transparent;color:#ccc;padding:8px 4px;text-align:left;font:16px Georgia;cursor:pointer;touch-action:manipulation}
#game-menu select option{background:#161616;color:#eee}
#game-menu :focus-visible{outline:1px solid #aaa;outline-offset:-2px}
#menu-main .menu-btn{position:relative;color:#aaa;border:0;min-height:42px;width:max-content;min-width:100px;padding:4px 22px;font-size:clamp(18px,2vw,28px);transition:color .14s}
#menu-main .current{color:#fff}
#menu-main .current::before{content:"";position:absolute;left:3px;top:50%;width:4px;height:4px;background:currentColor;transform:translateY(-50%) rotate(45deg)}
#menu-main .menu-btn:focus{outline:none}
.menu-btn:hover,.menu-btn:focus{color:#fff}
.slot small{display:block;margin-top:3px;color:#aaa;font:12px/1.35 sans-serif}
.note,#equip-help,.item-notes p,#collection p{font:14px/1.42 Georgia;color:#bbb;margin:8px 0 12px}
#menu-note:empty{display:none}
.menu-version{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(6px,env(safe-area-inset-bottom));color:#888;font:10px/1.5 sans-serif;letter-spacing:.1em}
.menu-panel>div:not([hidden]){animation:unveil .18s ease-out}
@keyframes unveil{from{opacity:.35}to{opacity:1}}
body.menu-open #touch-controls,body.menu-open #touch-extra{display:none!important}
.touch-btn,#stick{border-radius:50%;background:rgba(8,8,8,.45);color:#fafafa;border:1px solid #ffffff65;box-shadow:none}

function summonJelly(){

  const side=pl.x<b.x?-1:1;
  let home=clamp(b.x+side*(140+family.length*150),AL+120,AR-120);
  if(Math.abs(home-pl.x)<100)home=clamp(home+(pl.x<(AL+AR)/2?170:-170),AL+120,AR-120);

function swimJelly(h,dt){

function paintedBand(cam,front){
  if(!regionAtlas.complete||!regionAtlas.naturalWidth)return;
  const k=G.th,sx=(k%2)*760,sy=Math.floor(k/2)*554;
  const width=front?805:1340,offset=cam*(front?1.13:.17);
  const first=Math.floor((offset-12)/width),last=Math.floor((offset+W+12)/width);
  for(let i=first;i<=last;i++){const flip=Math.abs(i%2);
    X.save();X.translate(Math.round(i*width-offset)+(flip?width:0),0);if(flip)X.scale(-1,1);
    if(front)X.drawImage(regionAtlas,sx,sy+504,760,50,0,GY+30,width,H-GY-27);
    else X.drawImage(regionAtlas,sx,sy+44,760,388,0,-8,width,H+16);
    X.restore()}
}

X.textAlign='center';
if(G.bn.t>0){const a=Math.min(1,G.bn.t,(3.6-G.bn.t)*2);X.globalAlpha=Math.max(0,a);X.fillStyle=G.bn.a=='SEGUNDA FASE'?'#909090':'#ebebeb';X.font='italic 46px Georgia';X.fillText(G.bn.a,W/2,200);X.fillStyle='#b3b3b3';X.font='18px Georgia';X.fillText(G.bn.b,W/2,232);X.globalAlpha=1}

// Os oito IDs da coleção anterior permanecem válidos em saves existentes.

].map(([id,name,price,description,effect,path,color])=>[id,{id,name,price,description,effect,path,color:color||'#dfcba4',mark:new Path2D(path)}]));

function effectiveStats(){
  const has=id=>S.equipped.includes(id);
  const agility=Math.min(3,S.agi),dashTime=.2+agility*.015;
  const dashCooldown=(.55-agility*.07)*(has('geada')?.8:1);
  return {
    damageBase:1+S.dmg, damagePercent:(has('cinza')?20:0)+(has('pacto')?40:0),
    lastBreath:has('eco'), maxHP:Math.max(1,5+S.vit+(has('vigilia')?2:0)-(has('pacto')?2:0)),
    heal:2+S.flh+(has('raiz')?1:0), swordReach:(80+S.reach*14)*(has('fio')?1.2:1),
    sheathedLength:64*(1+S.reach*.17)*(has('fio')?1.2:1),
    swingTime:(20-3*Math.min(3,S.spd))/60, attackRate:has('veloz')?1.15:1,
    pogoSpeed:535*(has('mare')?1.25:1),dashTime,dashCooldown,
    dashGuard:Math.min(dashTime+agility*.008,dashCooldown-1/60),rewardPercent:has('farol')?130:100
  };
}
function refreshStats(){
  pl.stats=effectiveStats();pl.max=pl.stats.maxHP;pl.hp=Math.min(pl.hp,pl.max);
}
function lastBreathActive(){return pl.stats.lastBreath&&pl.hp===1&&!pl.dead}
function swordDamage(){
  const a=pl.stats;
  return a.damageBase*(100+a.damagePercent+(lastBreathActive()?50:0))/100;
}
// Cada fragmento recebe a diferença entre dois totais inteiros consecutivos.
// O prêmio é fixado na derrota: mudar os selos durante a coleta não o altera.
function rewardFragment(index){
  const rate=5*pl.stats.rewardPercent/100;
  return Math.round((index+1)*rate)-Math.round(index*rate);
}
function validateScrolls(){
  S.scrolls=[...new Set((Array.isArray(S.scrolls)?S.scrolls:[]).filter(id=>scrollRegistry.has(id)))];
  const raw=Array.isArray(S.equipped)?S.equipped:[];
  S.equipped=[0,1].map(i=>S.scrolls.includes(raw[i])&&(i===0||raw[0]!==raw[1])?raw[i]:null);
}
function buyScroll(id){
  const item=scrollRegistry.get(id);
  if(!G.shop||G.locked||screen!=='inventory'||!item||ownsScroll(id)||S.coins<item.price)return false;
  S.coins-=item.price;return acquireScroll(id);
}
function ownsScroll(id){return S.scrolls.includes(id)}
function acquireScroll(id){
  if(!scrollRegistry.has(id)||ownsScroll(id))return false;
  S.scrolls.push(id);sv();return true;
}
function equipScroll(id,slot){
  if(G.locked||!ownsScroll(id)||(slot!==0&&slot!==1))return false;
  const from=S.equipped.indexOf(id);
  if(from===slot)return false;
  if(from>=0)S.equipped[from]=S.equipped[slot];
  S.equipped[slot]=id;refreshStats();sv();return true;
}
function unequipScroll(slot){
  if(G.locked||(slot!==0&&slot!==1)||!S.equipped[slot])return false;
  S.equipped[slot]=null;refreshStats();sv();return true;
}

function sanitizeSave(){validateScrolls();for(const k of Object.keys(SAVE_DEFAULT)){const v=Number(S[k]);S[k]=Number.isFinite(v)?Math.max(0,Math.floor(v)):SAVE_DEFAULT[k]}S.st=Math.min(S.st,BOSS.length-1)}
sanitizeSave();reset();
const el=id=>document.getElementById(id);
const stick=el('stick'),stickAxes={x:0,y:0};
let stickBounds=null;let pointer=null,screen='main',origin='main',pending='';
function centerStick(){
  const old=pointer;pointer=null;stickAxes.x=stickAxes.y=0;stick.firstElementChild.style.transform='';
  if(old!==null&&stick.hasPointerCapture(old))stick.releasePointerCapture(old);
}
function moveStick(e){
  if(e.pointerId!==pointer)return;
  const r=stickBounds,radius=r.width*.32;
  if(!radius)return;
  const x=(e.clientX-r.left-r.width/2)/radius,y=(e.clientY-r.top-r.height/2)/radius;
  const length=Math.hypot(x,y),scale=1/Math.max(1,length),power=clamp((length-.16)/.84,0,1);
  stickAxes.x=length?x/length*power:0;stickAxes.y=length?y/length*power:0;
  stick.firstElementChild.style.transform='translate('+x*scale*radius+'px,'+y*scale*radius+'px)';
}
stick.onpointerdown=e=>{if(menuOpen||pointer!==null)return;e.preventDefault();stickBounds=stick.getBoundingClientRect();pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e)};
stick.onpointermove=moveStick;
stick.onpointerup=stick.onpointercancel=stick.onlostpointercapture=e=>{if(pointer===e.pointerId)centerStick()};
addEventListener('blur',centerStick);
function clearControls(){
  document.querySelector('[data-tap="KeyX"]').dispatchEvent(new Event('clearinput'));centerStick();for(const k in pressed)delete pressed[k];for(const k in keys)delete keys[k];
  pl.jb=pl.ab=pl.db=0;document.querySelectorAll('.touch-btn.down').forEach(b=>b.classList.remove('down'));
}
const select=el('control-type');
try{select.value=localStorage.getItem('regente_control_type')==='stick'?'stick':'arrows'}catch(e){}
function applyControl(){clearControls();document.body.classList.toggle('analog',select.value==='stick')}
applyControl();select.onchange=()=>{applyControl();try{localStorage.setItem('regente_control_type',select.value)}catch(e){}};
let audioTransition=Promise.resolve();
function syncGameAudio(){
  if(!AC)return;
  audioTransition=audioTransition.then(()=>{
    if(menuOpen&&AC.state!=='suspended')return AC.suspend();
    if(!menuOpen&&AC.state!=='running')return AC.resume();
  }).catch(()=>{});
}
const mainChoices=Array.from(el('menu-main').querySelectorAll('button'));
function selectMenuItem(button){
  for(const choice of mainChoices)choice.classList.toggle('current',choice===button);
}
for(const choice of mainChoices){
  choice.addEventListener('pointerenter',()=>selectMenuItem(choice));
  choice.addEventListener('focus',()=>selectMenuItem(choice));
}
el('menu-main').addEventListener('keydown',event=>{
  const step=event.key==='ArrowDown'?1:event.key==='ArrowUp'?-1:0;
  if(!step)return;
  event.preventDefault();
  mainChoices[(mainChoices.indexOf(document.activeElement)+step+mainChoices.length)%mainChoices.length].focus();
});
function openScreen(name){
  stopInventoryGesture();el('game-menu').classList.toggle('inventory-open',name==='inventory');
  clearControls();screen=name;menuOpen=true;stopLoop();
  document.body.classList.add('menu-open');el('game-menu').style.display='flex';
  for(const n of ['main','saves','pause','options','confirm','inventory'])el('menu-'+n).hidden=n!==name;
  document.querySelector('#game-menu h1').textContent=({pause:'PAUSA',options:'OPÇÕES',confirm:'CONFIRMAR',inventory:'INVENTÁRIO'})[name]||'O REGENTE OCO';
  el('game-menu').dataset.screen=name; if(name==='main'){selectMenuItem(el('menu-play'));el('menu-play').focus()}el('menu-note').hidden=name!=='main';
  syncGameAudio();
}
function resumeGame(){
  stopInventoryGesture();el('game-menu').classList.remove('inventory-open');clearControls();resetFps();screen='play';menuOpen=false;last=acc=0;
  document.body.classList.remove('menu-open');el('game-menu').style.display='none';
  initAudio();syncGameAudio();startLoop();
}
function showMainMenu(){openScreen('main');el('menu-note').textContent=''}
function ask(action){pending=action;el('question').textContent=action==='restart'?'Reiniciar esta fase?':'Salvar e voltar ao menu principal?';openScreen('confirm');el('cancel').focus()}
function escapeMenu(){
  if(!menuOpen){openScreen('pause');el('resume').focus()}
  else if(screen==='pause')resumeGame();
  else if(screen==='inventory')closeInventory();
  else if(screen==='options')openScreen(origin);
  else if(screen==='confirm')openScreen('pause');
  else if(screen==='saves')showMainMenu();
}
el('pause-toggle').onclick=()=>openScreen('pause');el('resume').onclick=resumeGame;
el('restart').onclick=()=>ask('restart');el('leave').onclick=()=>ask('leave');
el('cancel').onclick=()=>openScreen('pause');el('confirm').onclick=()=>{
  if(pending==='restart'){reset();resumeGame()}else{sv();showMainMenu()}
};
el('main-options').onclick=el('pause-options').onclick=()=>{origin=screen;openScreen('options')};
el('options-back').onclick=()=>openScreen(origin);
function showSaveSlots(){openScreen('saves');const box=document.getElementById('save-slots');box.innerHTML='';for(let n=1;n<=3;n++){const data=readSlot(n);const b=document.createElement('button');b.className='menu-btn slot';b.innerHTML='SAVE '+n+'<small>'+(data?'Aventura salva · '+(Number(data.coins)||0)+' fragmentos':'Novo jogo · vazio')+'</small>';b.addEventListener('click',()=>{activeSlot=n;const fresh=data||{...SAVE_DEFAULT};for(const k in S)delete S[k];Object.assign(S,SAVE_DEFAULT,fresh);sanitizeSave();sv();reset();resumeGame()});box.appendChild(b)}}
document.getElementById('menu-play').addEventListener('click',showSaveSlots);
document.getElementById('menu-back').addEventListener('click',showMainMenu);
document.getElementById('menu-exit').addEventListener('click',()=>{try{if(window.Android&&typeof window.Android.closeApp==='function'){window.Android.closeApp();return;}if(window.Android&&typeof window.Android.exitApp==='function'){window.Android.exitApp();return;}}catch(e){}document.getElementById('menu-note').textContent='O Android precisa autorizar o fechamento do aplicativo. Use o botão Voltar do aparelho para sair.';});
const inventory=el('menu-inventory'),sockets=el('sockets'),collection=el('collection');
let inventoryOrigin='play',selectedScroll=null,armed=false,gesture=null,ignoreClick=false,menuAudio;
function scrollIcon(id){
  const glyph=id?scrollRegistry.get(id).path:'M4 12H20M12 4V20';
  return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="'+glyph+'"/></svg>';
}
function renderInventory(){
  const stock=el('scroll-stock');stock.hidden=!G.shop||G.locked;
  if(!stock.hidden){
    el('scroll-prices').innerHTML=Array.from(scrollRegistry.values(),item=>{
      const owned=ownsScroll(item.id),disabled=owned||S.coins<item.price;
      return '<button data-buy="'+item.id+'" '+(disabled?'disabled':'')+'>'+item.name+'<br>'+item.effect+'<br>'+(owned?'Adquirido':item.price+' moedas')+'</button>';
    }).join('');
    stock.querySelector('summary').textContent='Pergaminhos à venda · '+S.coins+' moedas';
  }
  const oldScroll=collection.scrollTop;
  el('equipment-count').textContent=S.equipped.filter(Boolean).length+'/2';
  sockets.innerHTML=S.equipped.map((id,i)=>'<button class="rune socket" data-slot="'+i+'" data-id="'+(id||'')+'">'+scrollIcon(id)+'<span>Slot '+(i+1)+'</span><b>'+(id?scrollRegistry.get(id).name:'Vazio')+'</b></button>').join('');
  collection.innerHTML=S.scrolls.map(id=>{
    const n=S.equipped.indexOf(id);
    return '<button class="rune" data-id="'+id+'">'+scrollIcon(id)+'<b>'+scrollRegistry.get(id).name+'</b>'+(n<0?'':'<small>Slot '+(n+1)+'</small>')+'</button>';
  }).join('')||'<p>Nenhum pergaminho adquirido.</p>';
  collection.scrollTop=oldScroll;
  const item=scrollRegistry.get(selectedScroll);
  el('scroll-name').textContent=item?item.name:'Pergaminhos';
  el('scroll-text').textContent=item?item.description:'Os pergaminhos adquiridos aparecerão na coleção.';
  el('scroll-effect').textContent=item?item.effect:'';
  el('remove-scroll').hidden=G.locked||!item||!S.equipped.includes(selectedScroll);
  el('equip-help').textContent=G.locked?'Em batalha: é possível consultar, mas a troca está bloqueada.':'Arraste o símbolo ou toque no pergaminho e depois no slot. Deslize sobre os nomes para rolar.';
  for(const tile of inventory.querySelectorAll('.rune'))tile.setAttribute('aria-pressed',String(!!selectedScroll&&tile.dataset.id===selectedScroll));
}
function openInventory(){
  if(screen!=='play'&&screen!=='pause')return;
  inventoryOrigin=screen;armed=false;selectedScroll=S.equipped.find(Boolean)||S.scrolls[0]||null;
  openScreen('inventory');renderInventory();el('inventory-back').focus();
}
function closeInventory(){if(inventoryOrigin==='pause')openScreen('pause');else resumeGame()}
function placementFeedback(){
  armed=false;
  // O contexto da música e dos efeitos da batalha continua suspenso.
  try{
    if(!menuAudio)menuAudio=new (window.AudioContext||window.webkitAudioContext)();
    menuAudio.resume().catch(()=>{});const t=menuAudio.currentTime,o=menuAudio.createOscillator(),g=menuAudio.createGain();
    o.type='triangle';o.frequency.setValueAtTime(485,t);o.frequency.exponentialRampToValueAtTime(690,t+.09);
    g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
    o.connect(g);g.connect(menuAudio.destination);o.onended=()=>{o.disconnect();g.disconnect()};o.start(t);o.stop(t+.12);
  }catch(e){}
  renderInventory();sockets.classList.remove('placed');void sockets.offsetWidth;sockets.classList.add('placed');
}
function chooseTile(tile){
  const id=tile.dataset.id;
  if(tile.hasAttribute('data-slot')&&armed&&selectedScroll&&equipScroll(selectedScroll,Number(tile.dataset.slot))){placementFeedback();return}
  if(id){selectedScroll=id;armed=true;renderInventory()}
}
function stopInventoryGesture(){
  if(!gesture)return;
  const g=gesture;gesture=null;
  if(g.ghost)g.ghost.remove();
  if(inventory.hasPointerCapture(g.pointer))inventory.releasePointerCapture(g.pointer);
  inventory.classList.remove('dragging','can-return');
  for(const node of inventory.querySelectorAll('.target,.valid-drop'))node.classList.remove('target','valid-drop');
}
function dropTarget(e){
  const node=document.elementFromPoint(e.clientX,e.clientY);
  if(!node||!inventory.contains(node))return null;
  return node.closest('.socket.valid-drop')||(gesture.from>=0&&collection.contains(node)?collection:null);
}
inventory.addEventListener('pointerdown',e=>{
  if(gesture||e.button!==0)return;
  const tile=e.target.closest('.rune');if(!tile)return;
  ignoreClick=false;
  gesture={pointer:e.pointerId,id:tile.dataset.id,from:tile.hasAttribute('data-slot')?Number(tile.dataset.slot):-1,
    x:e.clientX,y:e.clientY,tile,scroll:collection.scrollTop,mode:'tap',handle:!!e.target.closest('svg')};
  try{inventory.setPointerCapture(e.pointerId)}catch(e){}
});
inventory.addEventListener('pointermove',e=>{
  const g=gesture;if(!g||g.pointer!==e.pointerId)return;
  const dx=e.clientX-g.x,dy=e.clientY-g.y;
  if(g.mode==='tap'&&Math.hypot(dx,dy)>=6){
    if(e.pointerType==='touch'&&g.from<0&&Math.abs(dy)>Math.abs(dx)&&(!g.handle||G.locked))g.mode='scroll';
    else if(g.id&&!G.locked){
      g.mode='drag';inventory.classList.add('dragging');if(g.from>=0)inventory.classList.add('can-return');
      for(const slot of sockets.children)if(slot.dataset.id!==g.id)slot.classList.add('valid-drop');
      g.ghost=document.createElement('div');g.ghost.className='scroll-ghost';g.ghost.innerHTML=scrollIcon(g.id);document.body.appendChild(g.ghost);
    }else g.mode='cancel';
  }
  if(g.mode==='scroll')collection.scrollTop=g.scroll-dy;
  if(g.mode==='drag'){
    g.ghost.style.transform='translate('+e.clientX+'px,'+e.clientY+'px) translate(-50%,-50%)';
    const old=inventory.querySelector('.target');if(old)old.classList.remove('target');
    const target=dropTarget(e);if(target)target.classList.add('target');
  }
});
inventory.addEventListener('pointerup',e=>{
  const g=gesture;if(!g||g.pointer!==e.pointerId)return;
  const target=g.mode==='drag'?dropTarget(e):null;
  stopInventoryGesture();ignoreClick=true;
  if(g.mode==='tap')chooseTile(g.tile);
  if(target){
    const changed=target===collection?unequipScroll(g.from):equipScroll(g.id,Number(target.dataset.slot));
    if(changed){selectedScroll=g.id;placementFeedback()}
  }
});
for(const type of ['pointercancel','lostpointercapture'])inventory.addEventListener(type,e=>{if(gesture&&gesture.pointer===e.pointerId)stopInventoryGesture()});
addEventListener('blur',stopInventoryGesture);
inventory.addEventListener('click',e=>{
  const tile=e.target.closest('.rune');
  if(tile&&(!ignoreClick||e.detail===0))chooseTile(tile);
  ignoreClick=false;
});
el('scroll-prices').onclick=e=>{
  const btn=e.target.closest('[data-buy]');
  if(btn&&buyScroll(btn.dataset.buy)){selectedScroll=btn.dataset.buy;placementFeedback()}
};
el('remove-scroll').onclick=()=>{if(unequipScroll(S.equipped.indexOf(selectedScroll)))placementFeedback()};
el('inventory-back').onclick=closeInventory;
el('inventory-toggle').onclick=el('pause-inventory').onclick=openInventory;

showMainMenu();
