name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o RegenteOcoAndroid-Projeto-CloudBuild.zip -d projeto

      - name: Install updated game HTML
        run: |
          SOURCE="index-atualizado.html"

          if [ ! -f "$SOURCE" ]; then
            echo "ERRO: index-atualizado.html não encontrado."
            exit 1
          fi

          mapfile -t TARGETS < <(find projeto -type f -path '*/app/src/main/assets/*' -name 'index.html')

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "ERRO: index.html não encontrado na pasta assets."
            echo "Arquivos HTML encontrados:"
            find projeto -type f -name '*.html' -print
            exit 1
          fi

          for TARGET in "${TARGETS[@]}"; do
            cp "$SOURCE" "$TARGET"
            echo "Jogo atualizado em: $TARGET"
          done

      - name: Install Regente Oco launcher icon
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifests = list(Path("projeto").glob("**/app/src/main/AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("ERRO: AndroidManifest.xml não encontrado.")

          vector = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#090909" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#E8E5E0" android:pathData="M14,78 L8,31 L31,49 L39,17 L54,46 L73,20 L76,49 L100,34 L91,78 Z"/>
              <path android:fillColor="#E8E5E0" android:pathData="M17,81 H91 V89 H17 Z"/>
              <path android:fillColor="#090909" android:pathData="M50,49 L54,57 L58,49 L56,69 L54,74 L52,69 Z"/>
              <path android:fillColor="#77736F" android:pathData="M23,74 L18,43 L29,55 Z M85,73 L94,47 L88,57 Z"/>
          </vector>
          """

          for manifest in manifests:
              app_dir = manifest.parent
              res_dir = app_dir / "res" / "drawable"
              res_dir.mkdir(parents=True, exist_ok=True)
              (res_dir / "ic_regente_launcher.xml").write_text(vector, encoding="utf-8")

              text = manifest.read_text(encoding="utf-8")
              if re.search(r'android:icon\s*=\s*"[^"]+"', text):
                  text = re.sub(r'android:icon\s*=\s*"[^"]+"',
                                'android:icon="@drawable/ic_regente_launcher"', text, count=1)
              else:
                  text = re.sub(r'<application\b',
                                '<application android:icon="@drawable/ic_regente_launcher"', text, count=1)
              manifest.write_text(text, encoding="utf-8")
              print(f"Ícone configurado em: {manifest}")
          PY

      - name: Fix Java and Kotlin targets
        run: |
          FILE=$(find projeto -path '*/app/build.gradle.kts' | head -n 1)

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              s = s.replace(
                  'android {',
                  '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          ''',
                  1
              )

          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find projeto -name settings.gradle.kts -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Regente-Oco-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
