
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o RegenteOcoAndroid-Projeto-CloudBuild.zip -d projeto

      - name: Install updated game HTML
        run: |
          SOURCE="index-atualizado.html"

          if [ ! -f "$SOURCE" ]; then
            echo "ERRO: index-atualizado.html não encontrado."
            exit 1
          fi

          mapfile -t TARGETS < <(find projeto -type f -path '*/app/src/main/assets/*' -name 'index.html')

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "ERRO: index.html não encontrado na pasta assets."
            echo "Arquivos HTML encontrados:"
            find projeto -type f -name '*.html' -print
            exit 1
          fi

          for TARGET in "${TARGETS[@]}"; do
            cp "$SOURCE" "$TARGET"
            echo "Jogo atualizado em: $TARGET"
          done

      - name: Fix Java and Kotlin targets
        run: |
          FILE=$(find projeto -path '*/app/build.gradle.kts' | head -n 1)

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              s = s.replace(
                  'android {',
                  '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          ''',
                  1
              )

          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find projeto -name settings.gradle.kts -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Regente-Oco-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
